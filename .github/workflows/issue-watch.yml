name: Issue watch

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  acknowledge:
    name: Mark issue for review
    runs-on: ubuntu-latest

    steps:
      - name: Add review label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create "needs-review" --color "fbca04" --description "Needs maintainer review" 2>/dev/null || true
          gh issue edit "${ISSUE_NUMBER}" --add-label "needs-review"

      - name: Add acknowledgement comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/ack.md"
          {
            echo "Thanks for reporting this. It has been marked for maintainer review."
            echo
            echo "Note: Arabic ships natively in Hermes Desktop since upstream \`5b6990e7a\` (2026-07-24), so the patch in this repository is superseded. If this is about the Arabic translation or RTL behaviour in a current Hermes build, please open it at <https://github.com/NousResearch/hermes-agent> — that is where fixes now land."
          } > "${body_file}"
          gh issue comment "${ISSUE_NUMBER}" --body-file "${body_file}"
